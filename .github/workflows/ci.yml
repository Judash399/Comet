name: ci

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install mkdocs-material mike

      - name: Install Lucide Icons
        run: |
          git clone https://github.com/lucide-icons/lucide.git temp-lucide
          mkdir -p docs/assets/overrides/.icons
          mv temp-lucide/icons docs/assets/overrides/.icons/lucide
          rm -rf temp-lucide

      - name: Deploy with Mike
        run: |
          mike deploy --push --force 0.2 dev
